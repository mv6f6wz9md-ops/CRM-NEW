function isOverdue(dueStr){
  if(!dueStr) return false;
  var m=dueStr.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return false;
  var due=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  var now=new Date();now.setHours(0,0,0,0);
  return due<now;
}
function isDueSoon(dueStr){
  if(!dueStr) return false;
  var m=dueStr.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return false;
  var due=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  var now=new Date();now.setHours(0,0,0,0);
  var diff=(due-now)/(1000*60*60*24);
  return diff>=0&&diff<=7;
}
function parseGermanDate(dueStr){
  if(!dueStr) return null;
  var m=dueStr.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
}
function formatGermanDate(d){
  return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear();
}
function normalizeDateStr(s){
  if(!s) return "";
  var m=String(s).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return String(s).trim();
  return parseInt(m[1])+"."+parseInt(m[2])+"."+m[3];
}
function getWeekDays(refDate){
  var d=new Date(refDate);
  var day=d.getDay();
  var diff=day===0?-6:1-day; // Monday as start
  var monday=new Date(d);
  monday.setDate(d.getDate()+diff);
  monday.setHours(0,0,0,0);
  var days=[];
  for(var i=0;i<7;i++){
    var dd=new Date(monday);
    dd.setDate(monday.getDate()+i);
    days.push(dd);
  }
  return days;
}

function waitForFirebase(maxWaitMs){
  return new Promise((resolve,reject)=>{
    const start=Date.now();
    const check=()=>{
      if(window.firebase&&window.firebase.initializeApp){resolve(true);return;}
      if(Date.now()-start>maxWaitMs){reject(new Error("Firebase SDK konnte nicht geladen werden. Bitte Seite neu laden."));return;}
      setTimeout(check,150);
    };
    check();
  });
}

async function initFirebase(){
  if(fbApp) return true;
  await waitForFirebase(8000);
  try{
    fbApp=firebase.initializeApp(firebaseConfig);
    fbDb=firebase.firestore();
    fbEnabled=true;
    return true;
  }catch(e){
    console.error("Firebase init error",e);
    throw e;
  }
}

// Pushes all local data to Firestore under the given sync code
function sanitizeForFirestore(obj){
  // Round-trip through JSON to strip undefined values and normalize nested structures
  return JSON.parse(JSON.stringify(obj));
}

function pushToCloud(syncCode){return _pushToCloudImpl(syncCode,false);}
function pushSettingsToCloud(syncCode){return _pushToCloudImpl(syncCode,true);}

async function _pushToCloudImpl(syncCode,settingsOnly){
  await initFirebase();
  const settingsTs=lsGet("crm:settingsTs",0);
  const raw={
    contacts:lsGet("crm:contacts",[]),
    tasks:lsGet("crm:tasks",[]),
    activities:lsGet("crm:activities",[]),
    docs:lsGet("crm:docs",[]),
    settings:lsGet("crm:settings",{}),
    settingsTs:settingsTs,
    bausteine:lsGet("crm:bausteine",[]),
    updatedAt:Date.now(),
    updatedBy:getSyncDeviceId(),
  };
  let data=sanitizeForFirestore(raw);
  // Logo stays local-only per device (never synced) to avoid Firestore size limits wiping it out.
  if(data.settings && data.settings.logo){
    data=Object.assign({},data,{settings:Object.assign({},data.settings,{logo:""})});
  }
  const docRef=fbDb.collection("clientos_sync").doc(syncCode);
  if(settingsOnly){
    // Only touch the settings + settingsTs fields, leave everything else untouched server-side
    await docRef.set({settings:data.settings,settingsTs:data.settingsTs,updatedAt:data.updatedAt,updatedBy:data.updatedBy},{merge:true});
  } else {
    // Merge write: never blindly overwrite settings/settingsTs with a possibly-stale local copy
    const existing=await docRef.get();
    const remoteSettingsTs=existing.exists?(existing.data().settingsTs||0):0;
    const payload=Object.assign({},data);
    if(remoteSettingsTs>settingsTs){
      // Remote settings are newer than what we have locally: don't overwrite them
      delete payload.settings;
      delete payload.settingsTs;
    }
    await docRef.set(payload,{merge:true});
  }
  return data;
}

// Pulls data from Firestore and overwrites local storage
async function pullFromCloud(syncCode){
  await initFirebase();
  const doc=await fbDb.collection("clientos_sync").doc(syncCode).get();
  if(!doc.exists) return null;
  const data=doc.data();
  if(data.contacts) lsSet("crm:contacts",data.contacts);
  if(data.tasks) lsSet("crm:tasks",data.tasks);
  if(data.activities) lsSet("crm:activities",data.activities);
  if(data.docs) lsSet("crm:docs",data.docs);
  if(data.settings){
    const localTs=lsGet("crm:settingsTs",0);
    const remoteTs=data.settingsTs||0;
    if(remoteTs>=localTs){
      const localLogo=(lsGet("crm:settings",{})||{}).logo||"";
      lsSet("crm:settings",Object.assign({},data.settings,{logo:data.settings.logo||localLogo}));
      lsSet("crm:settingsTs",remoteTs);
    }
  }
  if(data.bausteine) lsSet("crm:bausteine",data.bausteine);
  window.dispatchEvent(new Event("clientos:synced"));
  return data;
}

// Subscribe to realtime changes from other devices
function subscribeToCloud(syncCode,onUpdate){
  let unsub=()=>{};
  let cancelled=false;
  initFirebase().then(()=>{
    if(cancelled) return;
    const myDeviceId=getSyncDeviceId();
    unsub=fbDb.collection("clientos_sync").doc(syncCode).onSnapshot(snap=>{
      if(!snap.exists) return;
      const data=snap.data();
      if(data.updatedBy===myDeviceId) return; // ignore our own writes
      if(data.contacts) lsSet("crm:contacts",data.contacts);
      if(data.tasks) lsSet("crm:tasks",data.tasks);
      if(data.activities) lsSet("crm:activities",data.activities);
      if(data.docs) lsSet("crm:docs",data.docs);
      if(data.settings){
        const localTs=lsGet("crm:settingsTs",0);
        const remoteTs=data.settingsTs||0;
        if(remoteTs>=localTs){
          const localLogo=(lsGet("crm:settings",{})||{}).logo||"";
          lsSet("crm:settings",Object.assign({},data.settings,{logo:data.settings.logo||localLogo}));
          lsSet("crm:settingsTs",remoteTs);
        }
      }
      if(data.bausteine) lsSet("crm:bausteine",data.bausteine);
      window.dispatchEvent(new Event("clientos:synced"));
      onUpdate&&onUpdate(data);
    },err=>console.error("Sync listener error",err));
  }).catch(e=>console.error("subscribeToCloud init error",e));
  return ()=>{cancelled=true;unsub();};
}

function nextDocNumber(docs,type){
  const year=new Date().getFullYear();
  const prefix=DOC_PREFIX[type]||type;
  const existing=docs.filter(d=>d.type===type&&d.nr&&d.nr.startsWith(prefix+"-"+year)).map(d=>parseInt(d.nr.split("-").pop())||0);
  const max=existing.length>0?Math.max(...existing):0;
  return prefix+"-"+year+"-"+String(max+1).padStart(4,"0");
}

// ── WeekCalendar ────────────────────────────────────────────────────────────
const WEEKDAY_NAMES=["Mo","Di","Mi","Do","Fr","Sa","So"];
function WeekCalendar({tasks,setTasks,contacts,setActivities,goTo}){
  const [refDate,setRefDate]=useState(()=>new Date());
  const [quickAdd,setQuickAdd]=useState(null); // holds the day string when adding
  const [qTitle,setQTitle]=useState("");
  const [qContact,setQContact]=useState(contacts[0]?contacts[0].name:"");
  const [qZeit,setQZeit]=useState("");
  const [qPriority,setQPriority]=useState("Mittel");
  const weekDays=getWeekDays(refDate);
  const todayStr=formatGermanDate(new Date());

  const openQuickAdd=dayStr=>{
    setQuickAdd(dayStr);
    setQTitle("");
    setQContact(contacts[0]?contacts[0].name:"");
    setQZeit("");
    setQPriority("Mittel");
  };
  const saveQuickAdd=()=>{
    if(!qTitle.trim()) return;
    const t={id:uid(),title:qTitle.trim(),contact:qContact,priority:qPriority,due:quickAdd,zeit:qZeit,done:false};
    setTasks(p=>[t,...p]);
    setActivities(p=>[{id:uid(),type:"✅",text:'Aufgabe "'+t.title+'" erstellt',date:today()},...p]);
    setQuickAdd(null);
  };

  const tasksByDay=weekDays.map(day=>{
    const dayStr=formatGermanDate(day);
    return tasks.filter(t=>normalizeDateStr(t.due)===dayStr).slice().sort((a,b)=>{
      if(!a.zeit&&!b.zeit) return 0;
      if(!a.zeit) return 1;
      if(!b.zeit) return -1;
      return a.zeit.localeCompare(b.zeit);
    });
  });

  const prevWeek=()=>{const d=new Date(refDate);d.setDate(d.getDate()-7);setRefDate(d);};
  const nextWeek=()=>{const d=new Date(refDate);d.setDate(d.getDate()+7);setRefDate(d);};
  const goToday=()=>setRefDate(new Date());

  const monthLabel=weekDays[0].toLocaleDateString("de-DE",{month:"long",year:"numeric"});

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <button onClick={prevWeek} style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,color:C.accent,fontSize:16,padding:"8px 14px",cursor:"pointer"}}>‹</button>
      <div style={{textAlign:"center"}}>
        <div style={{fontWeight:800,fontSize:15,color:C.text}}>{monthLabel}</div>
        <button onClick={goToday} style={{background:"transparent",border:"none",color:C.accent,fontSize:11,fontWeight:600,cursor:"pointer",padding:"2px 0"}}>Heute</button>
      </div>
      <button onClick={nextWeek} style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,color:C.accent,fontSize:16,padding:"8px 14px",cursor:"pointer"}}>›</button>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {weekDays.map((day,i)=>{
        const dayStr=formatGermanDate(day);
        const isToday=dayStr===todayStr;
        const dayTasks=tasksByDay[i];
        const openTasks=dayTasks.filter(t=>!t.done);
        const doneTasks=dayTasks.filter(t=>t.done);
        const overdue=!isToday&&openTasks.length>0&&isOverdue(dayStr);
        return <div key={i} style={{background:C.card,border:"1px solid "+(isToday?C.accent:C.border),borderRadius:14,padding:"12px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:dayTasks.length>0?10:0}}>
            <div style={{background:isToday?C.accent:C.surface,color:isToday?"#fff":C.textSub,borderRadius:8,width:38,height:38,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <div style={{fontSize:9,fontWeight:700,lineHeight:1}}>{WEEKDAY_NAMES[i]}</div>
              <div style={{fontSize:14,fontWeight:800,lineHeight:1.2}}>{day.getDate()}</div>
            </div>
            <div style={{flex:1}}>
              {dayTasks.length===0?
                <div style={{color:C.muted,fontSize:12}}>Keine Termine</div>
                :<div style={{color:C.textSub,fontSize:12}}>{openTasks.length>0?openTasks.length+" offen":""}{openTasks.length>0&&doneTasks.length>0?" · ":""}{doneTasks.length>0?doneTasks.length+" erledigt":""}</div>
              }
            </div>
          </div>
          {dayTasks.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:8}}>
            {dayTasks.map(t=>(
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,background:C.surface,borderRadius:8,padding:"8px 10px",opacity:t.done?.6:1}}>
                {t.zeit&&<div style={{background:C.accentDim,color:C.accent,borderRadius:6,padding:"3px 7px",fontSize:11,fontWeight:700,flexShrink:0}}>{t.zeit}</div>}
                <Badge label={t.priority} color={PRIO_C[t.priority]}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{color:C.text,fontSize:13,fontWeight:600,textDecoration:t.done?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</div>
                  {t.contact&&<div style={{color:C.muted,fontSize:11,marginTop:1}}>{t.contact}</div>}
                </div>
              </div>
            ))}
          </div>}
          <button onClick={()=>openQuickAdd(dayStr)} style={{background:"transparent",border:"1px dashed "+C.border,borderRadius:8,color:C.accent,fontFamily:"inherit",fontWeight:600,fontSize:12,padding:"7px",width:"100%",cursor:"pointer"}}>+ Aufgabe</button>
        </div>;
      })}
    </div>

    <Sheet open={!!quickAdd} onClose={()=>setQuickAdd(null)} title={"Neue Aufgabe · "+(quickAdd||"")}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Field label="Titel *" value={qTitle} onChange={e=>setQTitle(e.target.value)} placeholder="Aufgabe beschreiben…"/>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Uhrzeit</label>
          <input type="time" value={qZeit} onChange={e=>setQZeit(e.target.value)} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px",outline:"none"}}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Kontakt</label>
          <select value={qContact} onChange={e=>setQContact(e.target.value)} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px"}}>
            {contacts.map(c=><option key={c.id}>{c.name}</option>)}
          </select>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Priorität</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {Object.keys(PRIO_C).map(p=>(
              <button key={p} onClick={()=>setQPriority(p)} style={{background:qPriority===p?PRIO_C[p]+"33":C.surface,border:"2px solid "+(qPriority===p?PRIO_C[p]:C.border),borderRadius:10,color:qPriority===p?PRIO_C[p]:C.textSub,fontFamily:"inherit",fontWeight:700,fontSize:13,padding:"11px 0",cursor:"pointer"}}>{p}</button>
            ))}
          </div>
        </div>
        <Btn onClick={saveQuickAdd} full>Speichern</Btn>
      </div>
    </Sheet>
  </div>;
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({contacts,tasks,activities}){
  const open=tasks.filter(t=>!t.done);
  const overdueCount=open.filter(t=>isOverdue(t.due)).length;
  const [docs]=useState(()=>lsGet("crm:docs",[]));
  const now=new Date();
  const thisMonth=now.getMonth(),thisYear=now.getFullYear();
  const parseDocDate=ds=>{
    if(!ds) return null;
    const m=ds.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    return m?new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1])):null;
  };
  const rechnungen=docs.filter(d=>d.type==="Rechnung");
  const offeneRechnungen=rechnungen.filter(d=>!d.bezahlt);
  const offenerBetrag=offeneRechnungen.reduce((s,d)=>s+d.positionen.reduce((ss,p)=>ss+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0),0);
  const umsatzMonat=rechnungen.filter(d=>{const dt=parseDocDate(d.datum);return dt&&dt.getMonth()===thisMonth&&dt.getFullYear()===thisYear;}).reduce((s,d)=>s+d.positionen.reduce((ss,p)=>ss+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0),0);
  const umsatzJahr=rechnungen.filter(d=>{const dt=parseDocDate(d.datum);return dt&&dt.getFullYear()===thisYear;}).reduce((s,d)=>s+d.positionen.reduce((ss,p)=>ss+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0),0);
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {[{label:"Kontakte",val:contacts.length,icon:"👤",color:C.accent},{label:overdueCount>0?"Überfällig":"Offen",val:overdueCount>0?overdueCount:open.length,icon:overdueCount>0?"🔴":"⏳",color:overdueCount>0?C.red:C.amber},{label:"Erledigt",val:tasks.length-open.length,icon:"✅",color:C.green},{label:"Aktivitäten",val:activities.length,icon:"📋",color:C.muted}].map(s=>(
        <div key={s.label} style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:"16px 14px"}}>
          <div style={{fontSize:24,marginBottom:6}}>{s.icon}</div>
          <div style={{fontSize:28,fontWeight:900,color:s.color}}>{s.val}</div>
          <div style={{fontSize:12,color:C.textSub,marginTop:2}}>{s.label}</div>
        </div>
      ))}
    </div>
    {docs.length>0&&<div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>Umsatzübersicht</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div>
          <div style={{fontSize:11,color:C.muted}}>Offene Rechnungen</div>
          <div style={{fontSize:18,fontWeight:800,color:offeneRechnungen.length>0?C.amber:C.text}}>{fmt(offenerBetrag)} €</div>
          <div style={{fontSize:10,color:C.muted}}>{offeneRechnungen.length} Stück</div>
        </div>
        <div>
          <div style={{fontSize:11,color:C.muted}}>Umsatz diesen Monat</div>
          <div style={{fontSize:18,fontWeight:800,color:C.green}}>{fmt(umsatzMonat)} €</div>
        </div>
        <div>
          <div style={{fontSize:11,color:C.muted}}>Umsatz dieses Jahr</div>
          <div style={{fontSize:18,fontWeight:800,color:C.green}}>{fmt(umsatzJahr)} €</div>
        </div>
        <div>
          <div style={{fontSize:11,color:C.muted}}>Rechnungen gesamt</div>
          <div style={{fontSize:18,fontWeight:800,color:C.text}}>{rechnungen.length}</div>
        </div>
      </div>
    </div>}
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>Offene Aufgaben</div>
      {open.length===0&&<div style={{color:C.muted,fontSize:14}}>Alles erledigt 🎉</div>}
      {open.slice(0,4).map(t=><div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid "+C.border}}>
        <div><div style={{color:C.text,fontWeight:600,fontSize:14}}>{t.title}</div><div style={{color:C.muted,fontSize:12,marginTop:2}}>{t.contact}{t.due?" · "+t.due:""}</div></div>
        <Badge label={t.priority} color={PRIO_C[t.priority]}/>
      </div>)}
    </div>
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:16}}>
      <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>Letzte Aktivitäten</div>
      {activities.slice(0,4).map(a=><div key={a.id} style={{display:"flex",gap:10,padding:"9px 0",borderBottom:"1px solid "+C.border}}>
        <span style={{fontSize:18}}>{a.type}</span>
        <div><div style={{color:C.text,fontSize:13}}>{a.text}</div><div style={{color:C.muted,fontSize:11,marginTop:2}}>{a.date}</div></div>
      </div>)}
    </div>
  </div>;
}

// ── Contacts ──────────────────────────────────────────────────────────────────
function Contacts({contacts,setContacts,setActivities,openContactId,goTo}){
  const [sheet,setSheet]=useState(null);
  const [editing,setEditing]=useState(false);
  const [docs]=useState(()=>lsGet("crm:docs",[]));

  useEffect(()=>{
    if(openContactId){
      const c=contacts.find(x=>x.id===openContactId);
      if(c) setSheet(c);
    }
  },[openContactId]);
  const [form,setForm]=useState({name:"",company:"",email:"",phone:"",strasse:"",plz:"",ort:"",status:"Aktiv"});
  const [noteText,setNoteText]=useState("");
  const [search,setSearch]=useState("");
  const ff=v=>e=>setForm(p=>Object.assign({},p,{[v]:e.target.value}));
  const filteredContacts=contacts.filter(c=>{
    if(!search.trim()) return true;
    const q=search.toLowerCase();
    return (c.name||"").toLowerCase().includes(q)||(c.company||"").toLowerCase().includes(q)||(c.phone||"").toLowerCase().includes(q)||(c.email||"").toLowerCase().includes(q);
  });

  const openAdd=()=>{setForm({name:"",company:"",email:"",phone:"",strasse:"",plz:"",ort:"",status:"Aktiv"});setEditing(false);setSheet("add");};
  const openEdit=c=>{setForm({name:c.name,company:c.company,email:c.email,phone:c.phone,strasse:c.strasse||"",plz:c.plz||"",ort:c.ort||"",status:c.status});setEditing(true);setSheet({...c,_edit:true});};

  const save=()=>{
    if(!form.name.trim())return;
    if(editing&&sheet&&sheet.id){
      setContacts(p=>p.map(c=>c.id===sheet.id?Object.assign({},c,form):c));
      setActivities(p=>[{id:uid(),type:"👤",text:"Kontakt "+form.name+" bearbeitet",date:today()},...p]);
      setSheet(Object.assign({},sheet,form));
    } else {
      const nc={id:uid(),notes:[],...form};
      setContacts(p=>[nc,...p]);
      setActivities(p=>[{id:uid(),type:"👤",text:"Kontakt "+nc.name+" hinzugefügt",date:today()},...p]);
      setSheet(null);
    }
    setEditing(false);
  };

  const addNote=contact=>{if(!noteText.trim())return;const note={id:uid(),text:noteText,date:today()};setContacts(p=>p.map(c=>c.id===contact.id?Object.assign({},c,{notes:[note,...c.notes]}):c));setActivities(p=>[{id:uid(),type:"📝",text:"Notiz zu "+contact.name,date:today()},...p]);setNoteText("");};
  const del=id=>{setContacts(p=>p.filter(c=>c.id!==id));setSheet(null);};
  const sel=sheet&&sheet!=="add"&&!editing?contacts.find(c=>c.id===sheet.id):null;

  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Btn onClick={openAdd} full>+ Neuer Kontakt</Btn>
    {contacts.length>0&&<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Suche nach Name, Firma, Telefon…" style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:14,padding:"11px 13px",outline:"none"}}/>}
    {contacts.length>0&&filteredContacts.length===0&&<div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:24,textAlign:"center",color:C.muted,fontSize:13}}>Keine Treffer für "{search}"</div>}
    {filteredContacts.map(c=><div key={c.id} onClick={()=>setSheet(c)} style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
      <div><div style={{fontWeight:700,fontSize:15,color:C.text}}>{c.name}</div><div style={{fontSize:13,color:C.textSub,marginTop:2}}>{c.company}</div></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}><Badge label={c.status} color={STATUS_C[c.status]}/><div style={{fontSize:11,color:C.muted}}>{c.notes.length} Notiz{c.notes.length!==1?"en":""}</div></div>
    </div>)}

    <Sheet open={sheet==="add"||(editing&&sheet&&sheet._edit)} onClose={()=>{setSheet(null);setEditing(false);}} title={editing?"Kontakt bearbeiten":"Neuer Kontakt"}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Field label="Name *" value={form.name} onChange={ff("name")} placeholder="Max Mustermann"/>
        <Field label="Firma" value={form.company} onChange={ff("company")} placeholder="Mustermann GmbH"/>
        <Field label="E-Mail" value={form.email} onChange={ff("email")} placeholder="max@example.de"/>
        <Field label="Telefon" value={form.phone} onChange={ff("phone")} placeholder="+49 ..."/>
        <Field label="Straße & Hausnummer" value={form.strasse} onChange={ff("strasse")} placeholder="Musterstraße 1"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10}}>
          <Field label="PLZ" value={form.plz} onChange={ff("plz")} placeholder="12345"/>
          <Field label="Ort" value={form.ort} onChange={ff("ort")} placeholder="Musterstadt"/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Status</label>
          <select value={form.status} onChange={ff("status")} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px"}}>{Object.keys(STATUS_C).map(s=><option key={s}>{s}</option>)}</select>
        </div>
        <Btn onClick={save} full>Speichern</Btn>
      </div>
    </Sheet>

    <Sheet open={!!sel} onClose={()=>setSheet(null)} title={sel?sel.name:""}>
      {sel&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Badge label={sel.status} color={STATUS_C[sel.status]}/>
        {sel.company&&<div style={{color:C.textSub,fontSize:14}}>🏢 {sel.company}</div>}
        {sel.email&&<a href={"mailto:"+sel.email} style={{color:C.accent,fontSize:14,textDecoration:"none"}}>📧 {sel.email}</a>}
        {sel.phone&&<a href={"tel:"+sel.phone} style={{color:C.accent,fontSize:14,textDecoration:"none"}}>📞 {sel.phone}</a>}
        {(sel.strasse||sel.plz||sel.ort)&&<div style={{color:C.textSub,fontSize:14}}>📍 {sel.strasse}{sel.strasse&&(sel.plz||sel.ort)?<br/>:""}{sel.plz} {sel.ort}</div>}
        <Btn onClick={()=>openEdit(sel)} variant="ghost" full>✏️ Bearbeiten</Btn>
        {(()=>{
          const relatedDocs=docs.filter(d=>d.contact===sel.name);
          if(relatedDocs.length===0) return null;
          return <div style={{borderTop:"1px solid "+C.border,paddingTop:14}}>
            <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:10,textTransform:"uppercase"}}>Belege ({relatedDocs.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {relatedDocs.map(d=>{
                const tot=d.positionen.reduce((s,p)=>s+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0);
                return <div key={d.id} onClick={()=>goTo&&goTo("docs",{openDocId:d.id})} style={{background:C.surface,borderRadius:10,padding:"10px 13px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{color:C.text,fontSize:13,fontWeight:600}}>{(DOC_TYPES[d.type]||d.type)+(d.nr?" · "+d.nr:"")}</div>
                    <div style={{color:C.muted,fontSize:11,marginTop:2}}>{d.datum}</div>
                  </div>
                  <div style={{color:C.green,fontSize:13,fontWeight:700}}>{fmt(tot)} €</div>
                </div>;
              })}
            </div>
          </div>;
        })()}
        <div style={{borderTop:"1px solid "+C.border,paddingTop:14}}>
          <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:10,textTransform:"uppercase"}}>Notizen</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Neue Notiz…" style={{flex:1,background:C.card,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:14,padding:"11px 13px",outline:"none"}}/>
            <button onClick={()=>addNote(sel)} style={{background:C.accent,border:"none",borderRadius:10,color:"#fff",fontWeight:700,fontSize:20,padding:"0 16px",cursor:"pointer"}}>+</button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {sel.notes.length===0&&<div style={{color:C.muted,fontSize:13}}>Noch keine Notizen.</div>}
            {sel.notes.map(n=><div key={n.id} style={{background:C.surface,borderRadius:10,padding:"10px 13px"}}><div style={{color:C.text,fontSize:13}}>{n.text}</div><div style={{color:C.muted,fontSize:11,marginTop:4}}>{n.date}</div></div>)}
          </div>
        </div>
        <Btn onClick={()=>del(sel.id)} variant="danger" full>Kontakt löschen</Btn>
      </div>}
    </Sheet>
  </div>;
}

// ── Tasks ─────────────────────────────────────────────────────────────────────
function Tasks({tasks,setTasks,contacts,setActivities}){
  const [sheet,setSheet]=useState(false);
  const [form,setForm]=useState({title:"",contact:contacts[0]?contacts[0].name:"",priority:"Mittel",due:"",zeit:""});
  const ff=v=>e=>setForm(p=>Object.assign({},p,{[v]:e.target.value}));
  const save=()=>{if(!form.title.trim())return;const t=Object.assign({},form,{id:uid(),done:false});setTasks(p=>[t,...p]);setActivities(p=>[{id:uid(),type:"✅",text:'Aufgabe "'+t.title+'" erstellt',date:today()},...p]);setSheet(false);setForm({title:"",contact:contacts[0]?contacts[0].name:"",priority:"Mittel",due:"",zeit:""});};
  const toggle=id=>setTasks(p=>p.map(t=>t.id===id?Object.assign({},t,{done:!t.done}):t));
  const del=id=>setTasks(p=>p.filter(t=>t.id!==id));
  const open=tasks.filter(t=>!t.done).slice().sort((a,b)=>{
    const aOver=isOverdue(a.due),bOver=isOverdue(b.due);
    if(aOver&&!bOver) return -1;
    if(!aOver&&bOver) return 1;
    return 0;
  });

function SignaturePad({value,onSave,onClose}){
  const canvasRef=useRef(null);
  const [drawing,setDrawing]=useState(false);
  const [hasContent,setHasContent]=useState(!!value);

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas) return;
    const ctx=canvas.getContext("2d");
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.getBoundingClientRect();
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
    ctx.scale(dpr,dpr);
    ctx.strokeStyle="#1a1a1a";
    ctx.lineWidth=2.5;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    if(value){
      const img=new Image();
      img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);
      img.src=value;
    }
  },[]);

  const getPos=e=>{
    const canvas=canvasRef.current;
    const rect=canvas.getBoundingClientRect();
    const touch=e.touches&&e.touches[0];
    const clientX=touch?touch.clientX:e.clientX;
    const clientY=touch?touch.clientY:e.clientY;
    return {x:clientX-rect.left,y:clientY-rect.top};
  };

  const start=e=>{
    e.preventDefault();
    setDrawing(true);
    setHasContent(true);
    const ctx=canvasRef.current.getContext("2d");
    const pos=getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
  };
  const move=e=>{
    if(!drawing) return;
    e.preventDefault();
    const ctx=canvasRef.current.getContext("2d");
    const pos=getPos(e);
    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
  };
  const end=()=>setDrawing(false);

  const clear=()=>{
    const canvas=canvasRef.current;
    const ctx=canvas.getContext("2d");
    const rect=canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    setHasContent(false);
  };

  const save=()=>{
    const canvas=canvasRef.current;
    onSave(canvas.toDataURL("image/png"));
    onClose();
  };

  return(
    <Sheet open={true} onClose={onClose} title="Unterschrift">
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{fontSize:13,color:C.muted}}>Unterschreibe unten mit dem Finger. Diese Unterschrift wird automatisch auf jedem Dokument eingefügt.</div>
        <div style={{background:"#fff",borderRadius:12,border:"2px solid "+C.border,overflow:"hidden",touchAction:"none"}}>
          <canvas
            ref={canvasRef}
            style={{width:"100%",height:220,display:"block",touchAction:"none"}}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={start} onTouchMove={move} onTouchEnd={end}
          />
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Btn onClick={clear} variant="ghost">🗑 Löschen</Btn>
          <Btn onClick={save} disabled={!hasContent}>Speichern</Btn>
        </div>
      </div>
    </Sheet>
  );
}

            <textarea value={p.text} onChange={updatePos(p.id,"text")} placeholder="Beschreibung (Enter für Zeilenumbruch)"
              style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:8,color:C.text,fontFamily:"inherit",fontSize:14,padding:"10px 12px",outline:"none",marginBottom:8,boxSizing:"border-box",resize:"none",lineHeight:1.6,minHeight:70,overflow:"hidden"}}
              rows={3} onInput={e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
            />
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              <div><div style={{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}}>Menge</div><input value={p.menge} onChange={updatePos(p.id,"menge")} inputMode="decimal" style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:8,color:C.text,fontFamily:"inherit",fontSize:14,padding:"10px 8px",outline:"none",textAlign:"center",boxSizing:"border-box"}}/></div>
              <div><div style={{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}}>Einzelpreis</div><input value={p.einzelpreis} onChange={updatePos(p.id,"einzelpreis")} placeholder="0,00" inputMode="decimal" style={{width:"100%",background:C.card,border:"1px solid "+C.border,borderRadius:8,color:C.text,fontFamily:"inherit",fontSize:14,padding:"10px 8px",outline:"none",textAlign:"right",boxSizing:"border-box"}}/></div>
              <div><div style={{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}}>Gesamt</div><div style={{background:C.border,borderRadius:8,color:C.green,fontWeight:700,fontSize:14,padding:"10px 8px",textAlign:"right"}}>{fmt(gp)} €</div></div>
            </div>
          </div>;
        })}
        <button onClick={addPos} style={{background:"transparent",border:"1px dashed "+C.border,borderRadius:10,color:C.accent,fontFamily:"inherit",fontWeight:600,fontSize:13,padding:"10px",width:"100%",cursor:"pointer"}}>+ Position hinzufügen</button>
      </div>
      <div style={{background:C.surface,border:"1px solid "+C.border,borderRadius:12,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:800,color:C.text,fontSize:15}}>Gesamtbetrag</span><span style={{fontWeight:800,color:C.green,fontSize:15}}>{fmt(total)} €</span></div>
        <div style={{fontSize:11,color:C.muted,marginTop:6}}>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Notiz / Zahlungsbedingungen</label>
          <button onClick={()=>setBausteinTarget({type:"notiz"})} style={{background:C.accent+"22",border:"1px solid "+C.accent+"44",borderRadius:6,color:C.accent,cursor:"pointer",fontSize:11,padding:"4px 8px",fontWeight:700,fontFamily:"inherit"}}>📋 Baustein</button>
        </div>
        <textarea value={form.notiz} onChange={sf("notiz")} rows={3} placeholder="z.B. Zahlbar innerhalb von 14 Tagen…" style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:14,padding:"13px 14px",outline:"none",resize:"vertical",lineHeight:1.6}}/>
      </div>
      <Btn onClick={()=>onSave(form)} full>{editDoc?"Änderungen speichern":"Dokument erstellen"}</Btn>
    </div>
  </Sheet>;
}

function DocPreview({doc,contacts,settings,onBack}){
  const s=settings||{};
  const pos=doc.positionen||[];
  const tot=pos.reduce((sum,p)=>sum+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0);
  const typLabel=DOC_TYPES[doc.type]||doc.type;
  const c=contacts.find(x=>x.name===doc.contact)||{};
  const [generating,setGenerating]=useState(false);
  

  const doPDF=async()=>{
    setGenerating(true);
    try{
      const frame=document.createElement("iframe");
      frame.style.cssText="position:fixed;left:-9999px;top:0;width:794px;height:1123px;border:none;background:#fff;";
      document.body.appendChild(frame);
      const html=buildDocHTML(doc,contacts,settings);
      frame.contentDocument.open();
      frame.contentDocument.write(html);
      frame.contentDocument.close();
      await new Promise(res=>setTimeout(res,1000));
      const canvas=await html2canvas(frame.contentDocument.body,{scale:1.5,useCORS:true,allowTaint:true,backgroundColor:"#ffffff",width:794,windowWidth:794,logging:false});
      document.body.removeChild(frame);
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
      const pdfW=pdf.internal.pageSize.getWidth(),pdfH=pdf.internal.pageSize.getHeight();
      const imgH=(canvas.height*pdfW)/canvas.width;
      const imgData=canvas.toDataURL("image/jpeg",0.95);
      if(imgH<=pdfH){pdf.addImage(imgData,"JPEG",0,0,pdfW,imgH);}
      else{let y=0;while(y<imgH){if(y>0)pdf.addPage();pdf.addImage(imgData,"JPEG",0,-y,pdfW,imgH);y+=pdfH;}}
      const filename=typLabel+"-"+(doc.nr||doc.datum)+".pdf";
      const pdfBlob=pdf.output("blob");
      const pdfFile=new File([pdfBlob],filename,{type:"application/pdf"});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[pdfFile]})){await navigator.share({files:[pdfFile],title:filename});}
      else{const url=URL.createObjectURL(pdfBlob);const a=document.createElement("a");a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
    }catch(e){console.error(e);}
    setGenerating(false);
  };

  return <div style={{position:"fixed",inset:0,zIndex:200,background:"#e0e0e0",display:"flex",flexDirection:"column"}}>
    <div style={{background:C.surface,borderBottom:"1px solid "+C.border,paddingTop:"calc(env(safe-area-inset-top) + 65px)",paddingBottom:"12px",paddingLeft:"16px",paddingRight:"16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,gap:8}}>
      <button onClick={onBack} style={{background:C.card,border:"1px solid "+C.border,color:C.accent,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:14,padding:"9px 14px",borderRadius:10,whiteSpace:"nowrap"}}>← Zurück</button>
      <span style={{fontWeight:800,fontSize:15,color:C.text}}>Vorschau</span>
      <button onClick={doPDF} disabled={generating} style={{background:DOC_GREEN,border:"none",color:"#fff",cursor:generating?"default":"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,padding:"9px 14px",borderRadius:10,whiteSpace:"nowrap",opacity:generating?.7:1}}>{generating?"⏳ Erstelle…":"📄 Als PDF"}</button>
    </div>
    {false&&<div style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"flex-end"}}><div style={{background:C.surface,borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%"}}><div style={{fontWeight:800,fontSize:17,color:C.text,marginBottom:12}}>PDF Fehler</div><div style={{fontSize:13,color:C.textSub,marginBottom:20}}>Bitte erneut versuchen oder im normalen Browser öffnen.</div><Btn onClick={()=>setShowHint(false)} full>OK</Btn></div></div>}
    <div style={{flex:1,overflowY:"auto",padding:"12px 8px 40px"}}>
      <div style={{background:"#fff",borderRadius:6,boxShadow:"0 2px 16px rgba(0,0,0,.2)",margin:"0 auto",overflow:"hidden",fontFamily:"Helvetica Neue,Arial,sans-serif",fontSize:12,color:"#1a1a1a"}}>
        <div style={{background:DOC_GREEN,padding:"20px",display:"flex",justifyContent:"space-between",alignItems:"center",minHeight:90,position:"relative",overflow:"hidden"}}>
          {s.logo&&<Fragment><img src={s.logo} alt="Logo" style={{position:"absolute",left:0,top:0,height:"100%",width:200,objectFit:"cover",objectPosition:"center"}}/><div style={{position:"absolute",left:0,top:0,height:"100%",width:200,background:"linear-gradient(to right,transparent 55%,"+DOC_GREEN+" 100%)",zIndex:1}}/><div style={{width:180,flexShrink:0,position:"relative",zIndex:2}}/></Fragment>}
          <div style={{textAlign:"right",position:"relative",zIndex:2}}>
            <div style={{fontSize:24,fontWeight:900,textTransform:"uppercase",color:"#fff",letterSpacing:1}}>{typLabel}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.85)",marginTop:3,lineHeight:1.7}}>
              {doc.nr&&<div>Nummer: {doc.nr}</div>}<div>Datum: {doc.datum}</div>{doc.faellig&&<div>Fällig: {doc.faellig}</div>}
            </div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,padding:"16px 20px",borderBottom:"2px solid #eee"}}>
          <div><div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",color:DOC_GREEN,letterSpacing:.8,marginBottom:4}}>{typLabel} an:</div><div style={{fontSize:13,fontWeight:800,marginBottom:2}}>{doc.contact}</div><div style={{fontSize:11,color:"#555",lineHeight:1.5}}>{c.company&&<div>{c.company}</div>}{c.strasse&&<div>{c.strasse}{(c.plz||c.ort)?", "+c.plz+" "+c.ort:""}</div>}{c.email&&<div>{c.email}</div>}</div></div>
          <div><div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",color:DOC_GREEN,letterSpacing:.8,marginBottom:4}}>{typLabel} von:</div><div style={{fontSize:13,fontWeight:800,marginBottom:2}}>{s.firma}</div><div style={{fontSize:11,color:"#555",lineHeight:1.5}}>{s.telefon&&<div>{s.telefon}</div>}{s.email&&<div>{s.email}</div>}{s.strasse&&<div>{s.strasse}{(s.plz||s.ort)?", "+s.plz+" "+s.ort:""}</div>}</div></div>
        </div>
        <div style={{padding:"0 20px 16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:"4px 8px",background:DOC_GREEN,color:"#fff",padding:"7px 8px",marginTop:16,borderRadius:"4px 4px 0 0",alignItems:"center"}}>
            {["Beschreibung","Menge","Einzelpr.","Gesamt"].map((h,i)=><div key={h} style={{fontSize:9,fontWeight:800,textTransform:"uppercase",textAlign:i>0?"right":"left"}}>{h}</div>)}
          </div>
          {pos.map((p,i)=>{const m=parseDE(p.menge||1),ep=parseDE(p.einzelpreis||p.betrag||0),gp=m*ep;return <div key={p.id} style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:"4px 8px",padding:"8px",borderBottom:"1px solid #f0f0f0",background:i%2===0?"#fff":"#fafafa",alignItems:"start"}}>
            <div style={{fontSize:11,lineHeight:1.4,whiteSpace:"pre-line"}}>{p.text}</div>
            <div style={{fontSize:11,textAlign:"right",color:"#555",whiteSpace:"nowrap"}}>{m.toLocaleString("de-DE")}</div>
            <div style={{fontSize:11,textAlign:"right",color:"#555",whiteSpace:"nowrap"}}>{fmt(ep)} €</div>
            <div style={{fontSize:11,textAlign:"right",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(gp)} €</div>
          </div>;})}
          <div style={{marginTop:10}}>
            <div style={{display:"flex",justifyContent:"space-between",padding:"5px 8px",color:"#666",fontSize:11}}><span>Zwischensumme</span><span style={{whiteSpace:"nowrap"}}>{fmt(tot)} €</span></div>
            <div style={{display:"flex",justifyContent:"space-between",padding:"9px 8px",background:DOC_GREEN,color:"#fff",borderRadius:4,fontWeight:800,fontSize:12,marginTop:2}}><span>Fälliger Gesamtbetrag</span><span style={{whiteSpace:"nowrap",marginLeft:8}}>{fmt(tot)} €</span></div>
          </div>
        </div>
        {doc.notiz&&<div style={{margin:"0 20px 16px",background:"#f8f8f8",borderLeft:"3px solid "+DOC_GREEN,padding:"9px 12px",fontSize:11,color:"#444",lineHeight:1.5,whiteSpace:"pre-line"}}>{doc.notiz}</div>}
        <div style={{textAlign:"right",padding:"8px 20px 16px"}}>{s.signature?<img src={s.signature} alt="Unterschrift" style={{height:36,maxWidth:160,objectFit:"contain"}}/>:<div style={{height:30}}/>}<div style={{borderTop:"1px solid #555",width:80,marginLeft:"auto",paddingTop:4,fontSize:10,color:"#555"}}>{s.inhaber||s.firma}</div></div>
        {s.agb&&<div style={{borderTop:"1px solid #eee",padding:"12px 20px",fontSize:10,color:"#666",lineHeight:1.5}}><div style={{fontWeight:800,textTransform:"uppercase",color:DOC_GREEN,letterSpacing:.5,marginBottom:4,fontSize:9}}>Allgemeine Geschäftsbedingungen</div><div style={{whiteSpace:"pre-line"}}>{s.agb}</div></div>}
        {(s.iban||s.bank||s.steuernr||s.ustid)&&<div style={{padding:"6px 20px 0",fontSize:9,color:"#666",lineHeight:1.5}}>
          {(s.iban||s.bank)&&<div>{[s.bank,s.iban?"IBAN: "+s.iban:null,s.bic?"BIC: "+s.bic:null].filter(Boolean).join(" · ")}</div>}
          {(s.steuernr||s.ustid)&&<div>{[s.steuernr?"St.-Nr.: "+s.steuernr:null,s.ustid?"USt-ID: "+s.ustid:null].filter(Boolean).join(" · ")}</div>}
        </div>}
        <div style={{background:DOC_GREEN,color:"rgba(255,255,255,.9)",padding:"10px 20px",fontSize:10,textAlign:"center",letterSpacing:.4,fontWeight:600,marginTop:10}}>VIELEN DANK FÜR IHR VERTRAUEN</div>
      </div>
    </div>
  </div>;
}

function Docs({contacts,goTo,openDocFilter}){
  const [screen,setScreen]=useState(null);
  const [docs,setDocsRaw]=useState(()=>lsGet("crm:docs",[]));
  const [settings,setSettingsRaw]=useState(()=>lsGet("crm:settings",DEF_SETTINGS));
  const [search,setSearch]=useState("");
  const settingsSavingRef=useRef(false);

  useEffect(()=>{
    const onSyncUpdate=()=>{
      if(settingsSavingRef.current) return; // don't clobber an in-flight local edit
      setSettingsRaw(lsGet("crm:settings",DEF_SETTINGS));
      setDocsRaw(lsGet("crm:docs",[]));
    };
    window.addEventListener("clientos:synced",onSyncUpdate);
    return ()=>window.removeEventListener("clientos:synced",onSyncUpdate);
  },[]);

  useEffect(()=>{
    if(openDocFilter&&openDocFilter.openDocId){
      const d=docs.find(x=>x.id===openDocFilter.openDocId);
      if(d) setScreen(d);
    }
  },[openDocFilter]);
  const saveDocs=val=>{const n=typeof val==="function"?val(docs):val;setDocsRaw(n);lsSet("crm:docs",n);};
  const saveSettings=val=>{
    settingsSavingRef.current=true;
    const n=typeof val==="function"?val(settings):val;
    setSettingsRaw(n);
    lsSet("crm:settings",n);
    lsSet("crm:settingsTs",Date.now());
    const sc=getSyncCode();
    if(sc){pushSettingsToCloud(sc).catch(e=>console.error("settings push error",e)).finally(()=>{settingsSavingRef.current=false;});}
    else{settingsSavingRef.current=false;}
  };
  const handleSave=form=>{saveDocs(p=>[Object.assign({},form,{id:uid(),created:today()}),...p]);setScreen(null);};
  const handleEditSave=(originalId)=>form=>{
    saveDocs(p=>p.map(d=>d.id===originalId?Object.assign({},d,form):d));
    setScreen(docs.find(d=>d.id===originalId)?Object.assign({},docs.find(d=>d.id===originalId),form):null);
  };

  if(screen==="new") return <NewDocForm contacts={contacts} onSave={handleSave} onClose={()=>setScreen(null)} existingDocs={docs}/>;
  if(screen==="settings") return <DocsSettings settings={settings} saveSettings={saveSettings} onClose={()=>setScreen(null)}/>;
  if(screen&&screen._edit){
    const src=screen;
    return <NewDocForm contacts={contacts} onSave={handleEditSave(src.id)} onClose={()=>setScreen(docs.find(d=>d.id===src.id)||null)} existingDocs={docs} editDoc={src}/>;
  }
  if(screen&&screen._uebernehmen){
    const src=screen;
    const nextType=src.type==="Angebot"?"AB":src.type==="AB"?"Rechnung":"Rechnung";
    const prefill={type:nextType,contact:src.contact,positionen:src.positionen,notiz:src.notiz,faellig:src.faellig,fromType:src.type,fromNr:src.nr};
    return <NewDocForm contacts={contacts} onSave={handleSave} onClose={()=>setScreen(docs.find(d=>d.id===src.id)||null)} existingDocs={docs} prefill={prefill}/>;
  }
  if(screen&&screen._preview) return <DocPreview doc={screen} contacts={contacts} settings={settings} onBack={()=>setScreen(docs.find(d=>d.id===screen.id)||null)}/>;
  if(screen&&typeof screen==="object"&&screen.id){
    const doc=screen;
    const tot=doc.positionen.reduce((s,p)=>s+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0);
    return <Sheet open={true} onClose={()=>setScreen(null)} title={(DOC_TYPES[doc.type]||doc.type)+(doc.nr?" · "+doc.nr:"")}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:16}}>
          {[["Kontakt",doc.contact],["Datum",doc.datum],doc.faellig?["Fällig",doc.faellig]:null,["Erstellt",doc.created]].filter(Boolean).map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid "+C.border}}><span style={{color:C.textSub,fontSize:13}}>{l}</span><span style={{color:C.text,fontSize:13,fontWeight:600}}>{v}</span></div>)}
        </div>
        {(()=>{
          const linkedContact=contacts.find(x=>x.name===doc.contact);
          if(!linkedContact||!goTo) return null;
          return <Btn onClick={()=>goTo("contacts",linkedContact.id)} variant="ghost" full>👤 Kontaktprofil öffnen</Btn>;
        })()}
        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:16}}>
          <div style={{fontSize:11,color:C.textSub,fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Positionen</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:"6px 10px"}}>
            {["Beschreibung","Menge","Einzelpreis","Gesamt"].map((h,i)=><div key={h} style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",textAlign:i>0?"right":"left",paddingBottom:6,borderBottom:"1px solid "+C.border}}>{h}</div>)}
            {doc.positionen.map(p=>{const m=parseDE(p.menge||1),ep=parseDE(p.einzelpreis||p.betrag||0),gp=m*ep;return <Fragment key={p.id}>
              <div style={{color:C.text,fontSize:13,paddingBottom:8,borderBottom:"1px solid "+C.border,whiteSpace:"pre-line"}}>{p.text}</div>
              <div style={{color:C.textSub,fontSize:13,textAlign:"right",paddingBottom:8,borderBottom:"1px solid "+C.border}}>{m.toLocaleString("de-DE")}</div>
              <div style={{color:C.textSub,fontSize:13,textAlign:"right",paddingBottom:8,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{fmt(ep)} €</div>
              <div style={{color:C.text,fontSize:13,fontWeight:700,textAlign:"right",paddingBottom:8,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{fmt(gp)} €</div>
            </Fragment>;})}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:12,paddingTop:10,borderTop:"2px solid "+C.border}}><span style={{fontWeight:800,color:C.text,fontSize:14}}>Fälliger Gesamtbetrag</span><span style={{fontWeight:800,color:C.green,fontSize:14,whiteSpace:"nowrap"}}>{fmt(tot)} €</span></div>
        </div>
        {doc.type==="Rechnung"&&<Btn onClick={()=>{
          const upd=Object.assign({},doc,{bezahlt:!doc.bezahlt,bezahltAm:!doc.bezahlt?today():null});
          saveDocs(p=>p.map(x=>x.id===doc.id?upd:x));
          setScreen(upd);
        }} variant={doc.bezahlt?"ghost":"primary"} full style={doc.bezahlt?{}:{background:C.green}}>
          {doc.bezahlt?"✓ Als bezahlt markiert ("+(doc.bezahltAm||"")+") · Zurücksetzen":"💶 Als bezahlt markieren"}
        </Btn>}
        <Btn onClick={()=>setScreen(Object.assign({},doc,{_preview:true}))} full>👁 Vorschau &amp; PDF</Btn>
        <Btn onClick={()=>setScreen(Object.assign({},doc,{_edit:true}))} variant="ghost" full>✏️ Bearbeiten</Btn>
        <Btn onClick={()=>setScreen(Object.assign({},doc,{_uebernehmen:true}))} variant="ghost" full>{"📋 Als "+(doc.type==="Angebot"?"Auftragsbestätigung":"Rechnung")+" übernehmen"}</Btn>
        <Btn onClick={()=>{saveDocs(p=>p.filter(d=>d.id!==doc.id));setScreen(null);}} variant="danger" full>Dokument löschen</Btn>
      </div>
    </Sheet>;
  }
  const filteredDocs=docs.filter(d=>{
    if(!search.trim()) return true;
    const q=search.toLowerCase();
    return (d.contact||"").toLowerCase().includes(q)||(d.nr||"").toLowerCase().includes(q)||(DOC_TYPES[d.type]||d.type||"").toLowerCase().includes(q);
  });
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      <Btn onClick={()=>setScreen("new")} full>+ Neu</Btn>
      <Btn onClick={()=>setScreen("settings")} variant="ghost" full>⚙ Firmendaten</Btn>
    </div>
    {docs.length>0&&<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Suche nach Name, Nummer, Typ…" style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:14,padding:"11px 13px",outline:"none"}}/>}
    {docs.length===0&&<div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:32,textAlign:"center"}}><div style={{fontSize:32,marginBottom:8}}>📄</div><div style={{color:C.textSub,fontSize:14}}>Noch keine Dokumente.</div><div style={{color:C.muted,fontSize:12,marginTop:4}}>Zuerst Firmendaten unter ⚙ einrichten.</div></div>}
    {docs.length>0&&filteredDocs.length===0&&<div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:24,textAlign:"center",color:C.muted,fontSize:13}}>Keine Treffer für "{search}"</div>}
    {filteredDocs.map(d=>{const tot=d.positionen.reduce((s,p)=>s+(parseDE(p.menge||1)*parseDE(p.einzelpreis||p.betrag||0)),0);return <div key={d.id} onClick={()=>setScreen(d)} style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,padding:"14px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{fontWeight:700,fontSize:15,color:C.text}}>{(DOC_TYPES[d.type]||d.type)+(d.nr?" · "+d.nr:"")}</div>
          {d.type==="Rechnung"&&<Badge label={d.bezahlt?"Bezahlt":"Offen"} color={d.bezahlt?C.green:C.amber}/>}
        </div>
        <div style={{fontSize:13,color:C.textSub,marginTop:2}}>{d.contact+" · "+d.datum}</div>
      </div>
      <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:C.green,fontSize:15}}>{fmt(tot)} €</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{d.positionen.length} Pos.</div></div>
    </div>;})}
  </div>;
}

// ── SyncSettings ─────────────────────────────────────────────────────────────
function SyncSettings({syncCode,setSyncCodeState,onClose,onReload,showToast}){
  const [mode,setMode]=useState(syncCode?"connected":"choose"); // choose | create | join | connected
  const [inputCode,setInputCode]=useState("");
  const [busy,setBusy]=useState(false);
  const [error,setError]=useState("");

  const genCode=()=>{
    const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c="";
    for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
    return c;
  };

  const createNew=async()=>{
    setBusy(true);setError("");
    try{
      const code=genCode();
      await pushToCloud(code);
      setSyncCode(code);
      setSyncCodeState(code);
      setMode("connected");
      showToast("☁️ Sync aktiviert!");
    }catch(e){
      console.error("Sync createNew error:",e);
      setError("Fehler: "+(e&&e.message?e.message:String(e)));
    }
    setBusy(false);
  };

  const joinExisting=async()=>{
    if(!inputCode.trim()||inputCode.trim().length<4){setError("Bitte gültigen Code eingeben.");return;}
    setBusy(true);setError("");
    try{
      const code=inputCode.trim().toUpperCase();
      const data=await pullFromCloud(code);
      if(!data){setError("Code nicht gefunden. Bitte prüfen.");setBusy(false);return;}
      setSyncCode(code);
      setSyncCodeState(code);
      onReload&&onReload();
      setMode("connected");
      showToast("☁️ Daten übernommen & verbunden!");
    }catch(e){
      console.error("Sync joinExisting error:",e);
      setError("Fehler: "+(e&&e.message?e.message:String(e)));
    }
    setBusy(false);
  };

  const disconnect=()=>{
    setSyncCode(null);
    setSyncCodeState(null);
    setMode("choose");
    showToast("☁️ Sync getrennt");
  };

  return(
    <Sheet open={true} onClose={onClose} title="Cloud-Synchronisierung">
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {mode==="connected"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{background:C.green+"15",border:"1px solid "+C.green+"44",borderRadius:14,padding:18,textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:8}}>☁️✓</div>
              <div style={{color:C.text,fontWeight:700,fontSize:16,marginBottom:4}}>Synchronisierung aktiv</div>
              <div style={{color:C.textSub,fontSize:13}}>Dein Sync-Code:</div>
              <div style={{fontSize:24,fontWeight:900,color:C.green,letterSpacing:3,marginTop:6,fontFamily:"monospace"}}>{syncCode}</div>
            </div>
            <div style={{fontSize:13,color:C.textSub,lineHeight:1.6,background:C.card,borderRadius:10,padding:14}}>
              📱 Gib diesen Code auf deinem anderen Gerät (z.B. iPad) unter ☁️ → "Vorhandenen Code verwenden" ein, um beide Geräte zu verbinden. Änderungen werden danach automatisch zwischen beiden Geräten synchronisiert.
            </div>
            <Btn onClick={disconnect} variant="danger" full>Synchronisierung trennen</Btn>
          </div>
        )}

        {mode==="choose"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{fontSize:13,color:C.textSub,lineHeight:1.6}}>
              Verbinde mehrere Geräte (z.B. iPhone & iPad), damit Kontakte, Aufgaben und Belege überall synchron sind.
            </div>
            <Btn onClick={()=>setMode("create")} full>📱 Neue Synchronisierung starten</Btn>
            <Btn onClick={()=>setMode("join")} variant="ghost" full>🔗 Vorhandenen Code verwenden</Btn>
          </div>
        )}

        {mode==="create"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{fontSize:13,color:C.textSub,lineHeight:1.6}}>
              Auf diesem Gerät wird ein neuer Sync-Code erstellt. Verbinde dein zweites Gerät später mit diesem Code.
            </div>
            {error&&<div style={{color:C.red,fontSize:13,background:C.red+"15",borderRadius:10,padding:"10px 14px"}}>{error}</div>}
            <Btn onClick={createNew} disabled={busy} full>{busy?"⏳ Wird erstellt…":"Code erstellen & aktivieren"}</Btn>
            <Btn onClick={()=>setMode("choose")} variant="ghost" full>Zurück</Btn>
          </div>
        )}

        {mode==="join"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{fontSize:13,color:C.textSub,lineHeight:1.6}}>
              Gib den Sync-Code ein, der auf deinem anderen Gerät angezeigt wird. Achtung: Die aktuellen Daten auf diesem Gerät werden dabei durch die Cloud-Daten ersetzt.
            </div>
            <input value={inputCode} onChange={e=>setInputCode(e.target.value.toUpperCase())} placeholder="z.B. AB3X7K" style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,color:C.text,fontFamily:"monospace",fontSize:20,fontWeight:700,letterSpacing:3,padding:"14px",outline:"none",textAlign:"center"}}/>
            {error&&<div style={{color:C.red,fontSize:13,background:C.red+"15",borderRadius:10,padding:"10px 14px"}}>{error}</div>}
            <Btn onClick={joinExisting} disabled={busy} full>{busy?"⏳ Verbinde…":"Verbinden & übernehmen"}</Btn>
            <Btn onClick={()=>setMode("choose")} variant="ghost" full>Zurück</Btn>
          </div>
        )}
      </div>
    </Sheet>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const NAV=[{id:"dashboard",label:"Home",icon:"⬛"},{id:"contacts",label:"Kontakte",icon:"👤"},{id:"tasks",label:"Aufgaben",icon:"✅"},{id:"docs",label:"Dokumente",icon:"📄"},{id:"calendar",label:"Kalender",icon:"📅"}];
const VIEWS={dashboard:"Dashboard",contacts:"Kontakte",tasks:"Aufgaben",docs:"Dokumente",calendar:"Kalender"};

function App(){
  const [view,setView]=useState("dashboard");
  const [viewParam,setViewParam]=useState(null);
  const goTo=(v,param)=>{setViewParam(param||null);setView(v);};
  const [contacts,setContactsRaw]=useState(()=>lsGet("crm:contacts",DEF_CONTACTS));
  const [tasks,setTasksRaw]=useState(()=>lsGet("crm:tasks",DEF_TASKS));
  const [activities,setActivitiesRaw]=useState(()=>lsGet("crm:activities",DEF_ACT));
  const fileRef=useRef(null);
  const [toast,setToast]=useState("");
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),3000);};
  const [syncCode,setSyncCodeState]=useState(()=>getSyncCode());
  const [syncStatus,setSyncStatus]=useState("idle"); // idle | syncing | synced | error
  const [showSync,setShowSync]=useState(false);
  const pushTimer=useRef(null);

  const schedulePush=()=>{
    if(!syncCode) return;
    if(pushTimer.current) clearTimeout(pushTimer.current);
    setSyncStatus("syncing");
    pushTimer.current=setTimeout(()=>{
      pushToCloud(syncCode).then(()=>setSyncStatus("synced")).catch(()=>setSyncStatus("error"));
    },800);
  };

  const setContacts=val=>{const n=typeof val==="function"?val(contacts):val;setContactsRaw(n);lsSet("crm:contacts",n);schedulePush();};
  const setTasks=val=>{const n=typeof val==="function"?val(tasks):val;setTasksRaw(n);lsSet("crm:tasks",n);schedulePush();};
  const setActivities=val=>{const n=typeof val==="function"?val(activities):val;setActivitiesRaw(n);lsSet("crm:activities",n);schedulePush();};

  // Reload all state from localStorage (used after a cloud pull/update)
  const reloadFromStorage=()=>{
    setContactsRaw(lsGet("crm:contacts",DEF_CONTACTS));
    setTasksRaw(lsGet("crm:tasks",DEF_TASKS));
    setActivitiesRaw(lsGet("crm:activities",DEF_ACT));
  };

  // Subscribe to realtime cloud updates when syncCode is set
  useEffect(()=>{
    if(!syncCode) return;
    const unsub=subscribeToCloud(syncCode,()=>{reloadFromStorage();showToast("🔄 Synchronisiert");});
    return unsub;
  },[syncCode]);
  const exportData=()=>{
    const data={contacts,tasks,activities,docs:lsGet("crm:docs",[]),settings:lsGet("crm:settings",{}),bausteine:lsGet("crm:bausteine",[]),exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const file=new File([blob],"clientos-backup-"+today().replace(/\./g,"-")+".json",{type:"application/json"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"ClientOS Backup"}).catch(()=>{});}
    else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
    showToast("✅ Export erstellt!");
  };
  const importData=e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.contacts)setContacts(d.contacts);
        if(d.tasks)setTasks(d.tasks);
        if(d.activities)setActivities(d.activities);
        if(d.docs)lsSet("crm:docs",d.docs);
        if(d.settings)lsSet("crm:settings",d.settings);
        if(d.bausteine)lsSet("crm:bausteine",d.bausteine);
        showToast("✅ Daten importiert!");
      }catch{showToast("❌ Datei ungültig.");}
    };
    reader.readAsText(file);e.target.value="";
  };
  if(showSync) return <SyncSettings syncCode={syncCode} setSyncCodeState={setSyncCodeState} onClose={()=>setShowSync(false)} onReload={reloadFromStorage} showToast={showToast}/>;
  return <div style={{minHeight:"100dvh",background:C.bg,display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto"}}>
    <div style={{background:C.surface,borderBottom:"1px solid "+C.border,paddingTop:"calc(env(safe-area-inset-top) + 18px)",paddingBottom:"14px",paddingLeft:"20px",paddingRight:"20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div><div style={{fontWeight:900,fontSize:18,color:C.text,letterSpacing:-.5}}><span style={{color:C.accent}}>▸</span> ClientOS</div><div style={{fontSize:11,color:C.muted}}>{VIEWS[view]}</div></div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button onClick={()=>setShowSync(true)} title="Cloud-Synchronisierung" style={{background:C.card,border:"1px solid "+(syncCode?C.green+"66":C.border),borderRadius:10,color:syncCode?C.green:C.textSub,fontFamily:"inherit",fontWeight:700,fontSize:13,padding:"8px 12px",cursor:"pointer"}}>{syncCode?(syncStatus==="syncing"?"🔄":"☁️"):"☁️"}</button>
        <button onClick={exportData} title="Exportieren" style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,color:C.green,fontFamily:"inherit",fontWeight:700,fontSize:13,padding:"8px 12px",cursor:"pointer"}}>⬆️</button>
        <button onClick={()=>fileRef.current&&fileRef.current.click()} title="Importieren" style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,color:C.accent,fontFamily:"inherit",fontWeight:700,fontSize:13,padding:"8px 12px",cursor:"pointer"}}>⬇️</button>
        <input ref={fileRef} type="file" accept=".json" onChange={importData} style={{display:"none"}}/>
      </div>
      {toast&&<div style={{position:"fixed",top:80,left:"50%",transform:"translateX(-50%)",zIndex:300,background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:"10px 18px",color:C.text,fontWeight:600,fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,.5)",whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
    <div style={{flex:1,padding:"16px 16px 90px",overflowY:"auto"}}>
      {view==="dashboard"&&<Dashboard contacts={contacts} tasks={tasks} activities={activities}/>}
      {view==="contacts"&&<Contacts contacts={contacts} setContacts={setContacts} setActivities={setActivities} openContactId={viewParam} goTo={goTo}/>}
      {view==="tasks"&&<Tasks tasks={tasks} setTasks={setTasks} contacts={contacts} setActivities={setActivities}/>}
      {view==="docs"&&<Docs contacts={contacts} goTo={goTo} openDocFilter={viewParam}/>}
      {view==="calendar"&&<WeekCalendar tasks={tasks} setTasks={setTasks} contacts={contacts} setActivities={setActivities} goTo={goTo}/>}
    </div>
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.surface,borderTop:"1px solid "+C.border,display:"flex",flexShrink:0,zIndex:100,paddingBottom:"env(safe-area-inset-bottom)",boxSizing:"border-box"}}>
      {NAV.map(n=><button key={n.id} onClick={()=>setView(n.id)} style={{flex:1,background:"transparent",border:"none",padding:"12px 4px 10px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",borderTop:view===n.id?"2px solid "+C.accent:"2px solid transparent"}}>
        <span style={{fontSize:20}}>{n.icon}</span>
        <span style={{fontSize:10,color:view===n.id?C.accent:C.muted,fontWeight:view===n.id?700:400,fontFamily:"inherit"}}>{n.label}</span>
      </button>)}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
