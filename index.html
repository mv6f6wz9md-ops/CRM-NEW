<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClientOS">
<title>ClientOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0f14;
    font-family:'DM Sans','Segoe UI',sans-serif;overscroll-behavior:none;touch-action:manipulation}
  #root{height:100%;overflow:hidden}
  select,input,button,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#252d3d;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  bg:"#0d0f14", surface:"#161a23", card:"#1c2130", border:"#252d3d",
  accent:"#4f8ef7", accentDim:"#1a2f5e", green:"#34c47c", amber:"#f5a623",
  red:"#e05c5c", muted:"#5a6480", text:"#e8eaf2", textSub:"#8b93b0",
};
const STATUS_C = {"Aktiv":C.green,"In Bearbeitung":C.accent,"Wartend":C.amber,"Abgeschlossen":C.muted};
const PRIO_C   = {"Hoch":C.red,"Mittel":C.amber,"Niedrig":C.green};

const uid   = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toLocaleDateString("de-DE");

// localStorage helpers
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const DEF_CONTACTS = [
  {id:uid(),name:"Maria Hoffmann",company:"TechVision GmbH",email:"m.hoffmann@techvision.de",phone:"+49 89 1234567",status:"Aktiv",notes:[]},
  {id:uid(),name:"Klaus Berger",company:"Infraplan AG",email:"k.berger@infraplan.de",phone:"+49 40 9876543",status:"In Bearbeitung",notes:[]},
  {id:uid(),name:"Sophia Meier",company:"DataFlow Systems",email:"s.meier@dataflow.io",phone:"+49 30 5551234",status:"Aktiv",notes:[]},
];
const DEF_TASKS = [
  {id:uid(),title:"Angebot überarbeiten",contact:"Maria Hoffmann",priority:"Hoch",due:"12.06.2026",done:false},
  {id:uid(),title:"Kickoff-Meeting planen",contact:"Klaus Berger",priority:"Mittel",due:"15.06.2026",done:false},
  {id:uid(),title:"Rechnung prüfen",contact:"Sophia Meier",priority:"Niedrig",due:"20.06.2026",done:true},
];
const DEF_ACT = [
  {id:uid(),type:"📞",text:"Anruf mit Maria Hoffmann — Projektstatus besprochen",date:"05.06.2026"},
  {id:uid(),type:"📧",text:"E-Mail an Klaus Berger — Angebot gesendet",date:"04.06.2026"},
  {id:uid(),type:"📝",text:"Notiz zu Sophia Meier hinzugefügt",date:"03.06.2026"},
];

// ── Atoms ────────────────────────────────────────────────────────────────────
function Badge({label,color}){
  return <span style={{background:color+"22",color,border:`1px solid ${color}44`,borderRadius:6,padding:"3px 9px",fontSize:11,fontWeight:700}}>{label}</span>;
}
function Btn({children,onClick,variant="primary",full,disabled,style}){
  const v={primary:{background:C.accent,color:"#fff",border:"none"},ghost:{background:"transparent",color:C.textSub,border:`1px solid ${C.border}`},danger:{background:C.red+"22",color:C.red,border:`1px solid ${C.red}44`}};
  return <button onClick={onClick} disabled={disabled} style={{...v[variant],borderRadius:10,padding:"13px 20px",fontSize:15,fontWeight:700,fontFamily:"inherit",cursor:disabled?"default":"pointer",width:full?"100%":undefined,display:"flex",alignItems:"center",justifyContent:"center",gap:8,opacity:disabled?.6:1,...style}}>{children}</button>;
}
function Field({label,value,onChange,placeholder}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:5}}>
      {label&&<label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase",letterSpacing:.5}}>{label}</label>}
      <input value={value} onChange={onChange} placeholder={placeholder} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px",outline:"none",width:"100%"}}/>
    </div>
  );
}
function Sheet({open,onClose,title,children}){
  if(!open) return null;
  return(
    <div style={{position:"fixed",inset:0,zIndex:200,background:C.bg,
      display:"flex",flexDirection:"column",overflowY:"auto",
      WebkitOverflowScrolling:"touch"}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,
        paddingTop:"calc(env(safe-area-inset-top) + 14px)",
        paddingBottom:"12px",paddingLeft:"16px",paddingRight:"16px",
        display:"flex",alignItems:"center",justifyContent:"space-between",
        position:"sticky",top:0,zIndex:10,flexShrink:0}}>
        <span style={{fontWeight:800,fontSize:17,color:C.text,flex:1,marginRight:12}}>{title}</span>
        <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.border}`,
          color:C.accent,cursor:"pointer",fontFamily:"inherit",fontWeight:700,
          fontSize:14,display:"flex",alignItems:"center",gap:6,
          padding:"9px 16px",borderRadius:10,whiteSpace:"nowrap",flexShrink:0}}>
          ✕ Schließen
        </button>
      </div>
      <div style={{padding:"20px 16px 80px"}}>
        {children}
      </div>
    </div>
  );
}

const Screen = Sheet;
// ── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({contacts,tasks,activities}){
  const open=tasks.filter(t=>!t.done);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[{label:"Kontakte",val:contacts.length,icon:"👤",color:C.accent},{label:"Offen",val:open.length,icon:"⏳",color:C.amber},{label:"Erledigt",val:tasks.length-open.length,icon:"✅",color:C.green},{label:"Aktivitäten",val:activities.length,icon:"📋",color:C.muted}].map(s=>(
          <div key={s.label} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 14px"}}>
            <div style={{fontSize:24,marginBottom:6}}>{s.icon}</div>
            <div style={{fontSize:28,fontWeight:900,color:s.color}}>{s.val}</div>
            <div style={{fontSize:12,color:C.textSub,marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16}}>
        <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>Offene Aufgaben</div>
        {open.length===0&&<div style={{color:C.muted,fontSize:14}}>Alles erledigt 🎉</div>}
        {open.slice(0,4).map(t=>(
          <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
            <div>
              <div style={{color:C.text,fontWeight:600,fontSize:14}}>{t.title}</div>
              <div style={{color:C.muted,fontSize:12,marginTop:2}}>{t.contact}{t.due?` · ${t.due}`:""}</div>
            </div>
            <Badge label={t.priority} color={PRIO_C[t.priority]}/>
          </div>
        ))}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16}}>
        <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:12,textTransform:"uppercase",letterSpacing:.5}}>Letzte Aktivitäten</div>
        {activities.slice(0,4).map(a=>(
          <div key={a.id} style={{display:"flex",gap:10,padding:"9px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:18}}>{a.type}</span>
            <div>
              <div style={{color:C.text,fontSize:13}}>{a.text}</div>
              <div style={{color:C.muted,fontSize:11,marginTop:2}}>{a.date}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Contacts ─────────────────────────────────────────────────────────────────
function Contacts({contacts,setContacts,setActivities}){
  const [sheet,setSheet]=useState(null);
  const [form,setForm]=useState({name:"",company:"",email:"",phone:"",status:"Aktiv"});
  const [noteText,setNoteText]=useState("");
  const f=v=>e=>setForm(p=>({...p,[v]:e.target.value}));

  const save=()=>{
    if(!form.name.trim()) return;
    const c={...form,id:uid(),notes:[]};
    setContacts(p=>[c,...p]);
    setActivities(p=>[{id:uid(),type:"👤",text:`Kontakt ${c.name} hinzugefügt`,date:today()},...p]);
    setSheet(null); setForm({name:"",company:"",email:"",phone:"",status:"Aktiv"});
  };
  const addNote=contact=>{
    if(!noteText.trim()) return;
    const note={id:uid(),text:noteText,date:today()};
    setContacts(p=>p.map(c=>c.id===contact.id?{...c,notes:[note,...c.notes]}:c));
    setActivities(p=>[{id:uid(),type:"📝",text:`Notiz zu ${contact.name}`,date:today()},...p]);
    setNoteText("");
  };
  const del=id=>{
    setContacts(p=>p.filter(c=>c.id!==id));
    setSheet(null);
  };

  const sel=sheet&&sheet!=="add"?contacts.find(c=>c.id===sheet.id):null;

  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Btn onClick={()=>setSheet("add")} full>+ Neuer Kontakt</Btn>
      {contacts.map(c=>(
        <div key={c.id} onClick={()=>setSheet(c)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:C.text}}>{c.name}</div>
            <div style={{fontSize:13,color:C.textSub,marginTop:2}}>{c.company}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
            <Badge label={c.status} color={STATUS_C[c.status]}/>
            <div style={{fontSize:11,color:C.muted}}>{c.notes.length} Notiz{c.notes.length!==1?"en":""}</div>
          </div>
        </div>
      ))}

      <Sheet open={sheet==="add"} onClose={()=>setSheet(null)} title="Neuer Kontakt">
        <div style={{display:"flex",flexDirection:"column",gap:12,paddingBottom:8}}>
          <Field label="Name *" value={form.name} onChange={f("name")} placeholder="Max Mustermann"/>
          <Field label="Firma" value={form.company} onChange={f("company")} placeholder="Mustermann GmbH"/>
          <Field label="E-Mail" value={form.email} onChange={f("email")} placeholder="max@example.de"/>
          <Field label="Telefon" value={form.phone} onChange={f("phone")} placeholder="+49 ..."/>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Status</label>
            <select value={form.status} onChange={f("status")} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px"}}>
              {Object.keys(STATUS_C).map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <Btn onClick={save} full>Speichern</Btn>
        </div>
      </Sheet>

      <Sheet open={!!sel} onClose={()=>setSheet(null)} title={sel?.name||""}>
        {sel&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Badge label={sel.status} color={STATUS_C[sel.status]}/>
            {sel.company&&<div style={{color:C.textSub,fontSize:14}}>🏢 {sel.company}</div>}
            {sel.email&&<a href={`mailto:${sel.email}`} style={{color:C.accent,fontSize:14,textDecoration:"none"}}>📧 {sel.email}</a>}
            {sel.phone&&<a href={`tel:${sel.phone}`} style={{color:C.accent,fontSize:14,textDecoration:"none"}}>📞 {sel.phone}</a>}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:14}}>
              <div style={{fontSize:12,color:C.textSub,fontWeight:700,marginBottom:10,textTransform:"uppercase"}}>Notizen</div>
              <div style={{display:"flex",gap:8,marginBottom:12}}>
                <input value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Neue Notiz…" style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:14,padding:"11px 13px",outline:"none"}}/>
                <button onClick={()=>addNote(sel)} style={{background:C.accent,border:"none",borderRadius:10,color:"#fff",fontWeight:700,fontSize:20,padding:"0 16px",cursor:"pointer"}}>+</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {sel.notes.length===0&&<div style={{color:C.muted,fontSize:13}}>Noch keine Notizen.</div>}
                {sel.notes.map(n=>(
                  <div key={n.id} style={{background:C.surface,borderRadius:10,padding:"10px 13px"}}>
                    <div style={{color:C.text,fontSize:13}}>{n.text}</div>
                    <div style={{color:C.muted,fontSize:11,marginTop:4}}>{n.date}</div>
                  </div>
                ))}
              </div>
            </div>
            <Btn onClick={()=>del(sel.id)} variant="danger" full>Kontakt löschen</Btn>
          </div>
        )}
      </Sheet>
    </div>
  );
}

// ── Tasks ─────────────────────────────────────────────────────────────────────
function Tasks({tasks,setTasks,contacts,setActivities}){
  const [sheet,setSheet]=useState(false);
  const [form,setForm]=useState({title:"",contact:contacts[0]?.name||"",priority:"Mittel",due:""});
  const f=v=>e=>setForm(p=>({...p,[v]:e.target.value}));

  const save=()=>{
    if(!form.title.trim()) return;
    const t={...form,id:uid(),done:false};
    setTasks(p=>[t,...p]);
    setActivities(p=>[{id:uid(),type:"✅",text:`Aufgabe "${t.title}" erstellt`,date:today()},...p]);
    setSheet(false); setForm({title:"",contact:contacts[0]?.name||"",priority:"Mittel",due:""});
  };
  const toggle=id=>setTasks(p=>p.map(t=>t.id===id?{...t,done:!t.done}:t));
  const del=id=>setTasks(p=>p.filter(t=>t.id!==id));

  const open=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done);

  const Row=({t})=>(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 16px",opacity:t.done?.7:1,display:"flex",gap:12,alignItems:"center"}}>
      <div onClick={()=>toggle(t.id)} style={{width:26,height:26,borderRadius:8,border:`2px solid ${t.done?C.green:C.border}`,background:t.done?C.green+"33":"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,fontSize:14,color:C.green}}>{t.done?"✓":""}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{color:C.text,fontWeight:600,fontSize:14,textDecoration:t.done?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</div>
        <div style={{color:C.muted,fontSize:12,marginTop:2}}>{t.contact}{t.due?` · ${t.due}`:""}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
        <Badge label={t.priority} color={PRIO_C[t.priority]}/>
        <button onClick={()=>del(t.id)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16,padding:0}}>🗑</button>
      </div>
    </div>
  );

  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Btn onClick={()=>setSheet(true)} full>+ Neue Aufgabe</Btn>
      <div style={{fontSize:12,color:C.textSub,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Offen ({open.length})</div>
      {open.map(t=><Row key={t.id} t={t}/>)}
      {!open.length&&<div style={{color:C.muted,fontSize:14,padding:"8px 0"}}>Keine offenen Aufgaben 🎉</div>}
      {done.length>0&&<>
        <div style={{fontSize:12,color:C.textSub,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginTop:8}}>Erledigt ({done.length})</div>
        {done.map(t=><Row key={t.id} t={t}/>)}
      </>}
      <Sheet open={sheet} onClose={()=>setSheet(false)} title="Neue Aufgabe">
        <div style={{display:"flex",flexDirection:"column",gap:12,paddingBottom:8}}>
          <Field label="Titel *" value={form.title} onChange={f("title")} placeholder="Aufgabe beschreiben…"/>
          <Field label="Fällig am" value={form.due} onChange={f("due")} placeholder="20.06.2026"/>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Kontakt</label>
            <select value={form.contact} onChange={f("contact")} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px"}}>
              {contacts.map(c=><option key={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Priorität</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              {Object.keys(PRIO_C).map(p=>(
                <button key={p} onClick={()=>setForm(f=>({...f,priority:p}))} style={{background:form.priority===p?PRIO_C[p]+"33":C.surface,border:`2px solid ${form.priority===p?PRIO_C[p]:C.border}`,borderRadius:10,color:form.priority===p?PRIO_C[p]:C.textSub,fontFamily:"inherit",fontWeight:700,fontSize:13,padding:"11px 0",cursor:"pointer"}}>{p}</button>
              ))}
            </div>
          </div>
          <Btn onClick={save} full>Speichern</Btn>
        </div>
      </Sheet>
    </div>
  );
}

// ── Activity ──────────────────────────────────────────────────────────────────
function Activity({activities,setActivities}){
  const [text,setText]=useState("");
  const [type,setType]=useState("📝");
  const ICONS=["📞","📧","📝","🤝","📅"];
  const add=()=>{
    if(!text.trim()) return;
    setActivities(p=>[{id:uid(),type,text,date:today()},...p]);
    setText("");
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16}}>
        <div style={{display:"flex",gap:8,marginBottom:12,justifyContent:"center"}}>
          {ICONS.map(i=>(
            <button key={i} onClick={()=>setType(i)} style={{background:type===i?C.accent+"33":"transparent",border:`2px solid ${type===i?C.accent:C.border}`,borderRadius:10,padding:"8px 10px",fontSize:20,cursor:"pointer"}}>{i}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Aktivität beschreiben…" style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px",outline:"none"}}/>
          <button onClick={add} style={{background:C.accent,border:"none",borderRadius:10,color:"#fff",fontWeight:700,fontSize:20,padding:"0 18px",cursor:"pointer"}}>+</button>
        </div>
      </div>
      {activities.map(a=>(
        <div key={a.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 16px",display:"flex",gap:12,alignItems:"flex-start"}}>
          <span style={{fontSize:22}}>{a.type}</span>
          <div>
            <div style={{color:C.text,fontSize:14}}>{a.text}</div>
            <div style={{color:C.muted,fontSize:12,marginTop:4}}>{a.date}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── AI ────────────────────────────────────────────────────────────────────────
function AI({contacts,tasks}){
  const [mode,setMode]=useState("chat");
  const [input,setInput]=useState("");
  const [msgs,setMsgs]=useState([{role:"assistant",text:"Hallo! Ich bin dein CRM-Assistent. Ich kann Notizen zusammenfassen, E-Mails entwerfen oder dir Einblicke geben. Wie kann ich helfen?"}]);
  const [loading,setLoading]=useState(false);
  const [pick,setPick]=useState(contacts[0]?.name||"");
  const [result,setResult]=useState("");
  const [apiKey,setApiKey]=useState(()=>lsGet("crm:apikey",""));
  const [showKey,setShowKey]=useState(false);
  const chatRef=useRef(null);

  useEffect(()=>{if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight;},[msgs]);

  const callAPI=async(prompt,sys)=>{
    const key=lsGet("crm:apikey","");
    if(!key) return "Bitte erst den API-Schlüssel eingeben (⚙ oben).";
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:sys||"Du bist ein hilfreicher CRM-Assistent. Antworte auf Deutsch.",messages:[{role:"user",content:prompt}]})
    });
    const d=await r.json();
    if(d.error) return "Fehler: "+d.error.message;
    return d.content?.[0]?.text||"Keine Antwort.";
  };

  const send=async()=>{
    if(!input.trim()||loading) return;
    const q=input.trim(); setInput("");
    setMsgs(m=>[...m,{role:"user",text:q}]);
    setLoading(true);
    const ctx=`Kontakte: ${contacts.map(c=>c.name+" ("+c.company+")").join(", ")}. Offene Aufgaben: ${tasks.filter(t=>!t.done).length}.`;
    const reply=await callAPI(`${ctx}\n\nFrage: ${q}`);
    setMsgs(m=>[...m,{role:"assistant",text:reply}]);
    setLoading(false);
  };

  const generate=async()=>{
    setLoading(true); setResult("");
    const c=contacts.find(x=>x.name===pick);

  const green="#2d6a2d";

  const [showPrintHint,setShowPrintHint]=useState(false);

  const doPrint=()=>{
    const html=generateDocHTML(doc,contacts,settings);
    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const file=new File([blob],`${DOC_TYPES[doc.type]||doc.type}-${doc.nr||doc.datum}.html`,{type:"text/html"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:`${DOC_TYPES[doc.type]||doc.type} ${doc.nr||""}`.trim()})
        .catch(()=>setShowPrintHint(true));

        .catch(()=>setShowPrintHint(true))

const DOC_TYPES={"Angebot":"Angebot","AB":"Auftragsbestätigung","Rechnung":"Rechnung"};
const DOC_PREFIX={"Angebot":"ANG","AB":"AB","Rechnung":"RECHN"};

function nextDocNumber(docs, type){
  const year=new Date().getFullYear();
  const prefix=DOC_PREFIX[type]||type;
  const existing=docs
    .filter(d=>d.type===type && d.nr && d.nr.startsWith(prefix+"-"+year))
    .map(d=>parseInt(d.nr.split("-").pop())||0);
  const max=existing.length>0?Math.max(...existing):0;
  return `${prefix}-${year}-${String(max+1).padStart(4,"0")}`;
}

        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Fällig bis</label>
          <input value={form.faellig} onChange={sf("faellig")} placeholder="Bei Erhalt" style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:15,padding:"13px 14px",outline:"none"}}/>
        </div>
        <div>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase",display:"block",marginBottom:8}}>Positionen</label>
          {form.positionen.map((p,i)=>{
            const gesamt=(parseFloat(p.menge||1)*parseFloat(p.einzelpreis||0));
            return(
            <div key={p.id} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Position {i+1}</span>
                {form.positionen.length>1&&<button onClick={()=>delPos(p.id)} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer",padding:0}}>✕</button>}
              </div>
              <input value={p.text} onChange={updatePos(p.id,"text")} placeholder="Beschreibung"
                style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontFamily:"inherit",fontSize:14,padding:"10px 12px",outline:"none",marginBottom:8,boxSizing:"border-box"}}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                <div>
                  <div style={{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}}>Menge</div>
                  <input value={p.menge} onChange={updatePos(p.id,"menge")} inputMode="decimal"
                    style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontFamily:"inherit",fontSize:14,padding:"10px 8px",outline:"none",textAlign:"center",boxSizing:"border-box"}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}}>Einzelpreis</div>
                  <input value={p.einzelpreis} onChange={updatePos(p.id,"einzelpreis")} placeholder="0,00" inputMode="decimal"
                    style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontFamily:"inherit",fontSize:14,padding:"10px 8px",outline:"none",textAlign:"right",boxSizing:"border-box"}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}}>Gesamt</div>
                  <div style={{background:C.border,borderRadius:8,color:C.green,fontWeight:700,fontSize:14,padding:"10px 8px",textAlign:"right"}}>
                    {gesamt.toLocaleString("de-DE",{minimumFractionDigits:2})} €
                  </div>
                </div>
              </div>
            </div>
            );
          })}
          <button onClick={addPos} style={{background:"transparent",border:`1px dashed ${C.border}`,borderRadius:10,color:C.accent,fontFamily:"inherit",fontWeight:600,fontSize:13,padding:"10px",width:"100%",cursor:"pointer"}}>+ Position hinzufügen</button>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{fontWeight:800,color:C.text,fontSize:15}}>Gesamtbetrag</span>
            <span style={{fontWeight:800,color:C.green,fontSize:15}}>{total.toFixed(2)} €</span>
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:6}}>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:11,color:C.textSub,fontWeight:600,textTransform:"uppercase"}}>Notiz / Zahlungsbedingungen</label>
          <textarea value={form.notiz} onChange={sf("notiz")} rows={3} placeholder="z.B. Zahlbar innerhalb von 14 Tagen..."
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontFamily:"inherit",fontSize:14,padding:"13px 14px",outline:"none",resize:"none"}}/>
        </div>
        <Btn onClick={()=>onSave(form)} full>Dokument erstellen</Btn>
      </div>
    </Screen>
  );
}

  .header>*{position:relative;z-index:1}

  .doc-meta{text-align:right;font-size:11.5px;color:rgba(255,255,255,.88);margin-top:6px;line-height:1.8}
  .body{padding:28px 36px}
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid #eee}

  .party-name{font-size:15px;font-weight:800;margin-bottom:3px}
  .party-detail{font-size:12px;color:#555;line-height:1.6}
  table{width:100%;border-collapse:collapse;margin-bottom:20px}
  thead tr{background:${accentColor};color:#fff}
  th{padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;text-align:left}
  th.r{text-align:right}
  td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:12.5px;vertical-align:middle}
  td.r{text-align:right;white-space:nowrap}
  td.bold{font-weight:700}
  .sum-table{width:260px;margin-left:auto;margin-bottom:20px;border-collapse:collapse}

  .sum-total{background:${accentColor} !important;color:#fff;border-radius:4px}
  .sum-total td{font-weight:900;font-size:14px;padding:10px 12px;color:#fff}
  .zwischensumme td{border-top:1px solid #ddd;padding-top:10px}
  .notiz{background:#f8f8f8;border-left:3px solid ${accentColor};padding:11px 14px;font-size:11.5px;color:#444;margin-bottom:24px;line-height:1.6}
  .sig-area{text-align:right;margin:20px 36px 24px}
  .sig-line{border-top:1px solid #555;width:190px;margin-left:auto;padding-top:5px;font-size:11.5px;color:#555}
  .agb-section{padding:16px 36px 12px;border-top:1px solid #eee}
  .agb-title{font-size:10.5px;font-weight:800;text-transform:uppercase;color:${accentColor};margin-bottom:5px;letter-spacing:.5px}

  .footer-bar{background:${accentColor};color:rgba(255,255,255,.92);padding:12px 36px;font-size:11px;text-align:center;letter-spacing:.4px;font-weight:600}
  @media print{@page{margin:10mm;size:A4;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0}}
  @page{margin:10mm}
</style>
</head><body>
<div class="header">

      const m=parseFloat(p.menge||1);

        <td>${p.text}</td>
        <td class="r">${m.toLocaleString("de-DE")}</td>
        <td class="r">${ep.toLocaleString("de-DE",{minimumFractionDigits:2})} €</td>
        <td class="r bold">${gp.toLocaleString("de-DE",{minimumFractionDigits:2})} €</td>
      </tr>`;
    }).join("")}</tbody>

</body></html>`;
  return html;
}



function Docs({contacts}){
  const [screen,setScreen]=useState(null);
  const [docs,setDocsRaw]=useState(()=>lsGet("crm:docs",[]));
  const [settings,setSettingsRaw]=useState(()=>lsGet("crm:settings",DEF_SETTINGS));

  const saveDocs=val=>{const n=typeof val==="function"?val(docs):val;setDocsRaw(n);lsSet("crm:docs",n);};
  const saveSettings=val=>{const n=typeof val==="function"?val(settings):val;setSettingsRaw(n);lsSet("crm:settings",n);};

  const handleSave=form=>{
    const doc={...form,id:uid(),created:today()};
    saveDocs(p=>[doc,...p]);
    setScreen(null);
  };

  // Preview screen
  if(screen && screen._preview){
    const doc=screen;
    const backToDoc=()=>setScreen(docs.find(d=>d.id===doc.id)||null);
    return <DocPreview doc={doc} contacts={contacts} settings={settings} onBack={backToDoc}/>;
  }
  if(screen==="new") return <NewDocForm contacts={contacts} onSave={handleSave} onClose={()=>setScreen(null)} existingDocs={docs}/>;
  if(screen==="settings") return <DocsSettings settings={settings} saveSettings={saveSettings} onClose={()=>setScreen(null)}/>;
  if(screen && screen!=="new" && screen!=="settings"){
    const doc=screen;
    const tot=doc.positionen.reduce((s,p)=>s+(parseFloat(p.menge||1)*parseFloat(p.einzelpreis||p.betrag||0)),0);
    const closeDetail=()=>setScreen(null);
    return(
      <Screen open={true} onClose={closeDetail} title={`${DOC_TYPES[doc.type]||doc.type}${doc.nr?" · "+doc.nr:""}`}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
            {[["Kontakt",doc.contact],["Datum",doc.datum],doc.faellig?["Fällig",doc.faellig]:null,["Erstellt",doc.created]].filter(Boolean).map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
                <span style={{color:C.textSub,fontSize:13}}>{l}</span>
                <span style={{color:C.text,fontSize:13,fontWeight:600}}>{v}</span>
              </div>
            ))}
          </div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,overflowX:"auto"}}>
            <div style={{fontSize:11,color:C.textSub,fontWeight:700,textTransform:"uppercase",marginBottom:10}}>Positionen</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:"6px 10px",minWidth:300}}>
              {["Beschreibung","Menge","Einzelpreis","Gesamt"].map(h=>(
                <div key={h} style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",
                  textAlign:h==="Beschreibung"?"left":"right",paddingBottom:6,borderBottom:`1px solid ${C.border}`}}>{h}</div>
              ))}
              {doc.positionen.map(p=>{
                const m=parseFloat(p.menge||1);
                const ep=parseFloat(p.einzelpreis||p.betrag||0);
                const gp=m*ep;
                return(<React.Fragment key={p.id}>
                  <div style={{color:C.text,fontSize:13,paddingBottom:8,borderBottom:`1px solid ${C.border}`}}>{p.text}</div>
                  <div style={{color:C.textSub,fontSize:13,textAlign:"right",paddingBottom:8,borderBottom:`1px solid ${C.border}`}}>{m.toLocaleString("de-DE")}</div>
                  <div style={{color:C.textSub,fontSize:13,textAlign:"right",paddingBottom:8,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{ep.toLocaleString("de-DE",{minimumFractionDigits:2})} €</div>
                  <div style={{color:C.text,fontSize:13,fontWeight:700,textAlign:"right",paddingBottom:8,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{gp.toLocaleString("de-DE",{minimumFractionDigits:2})} €</div>
                </React.Fragment>);
              })}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:12,paddingTop:10,borderTop:`2px solid ${C.border}`}}>
              <span style={{fontWeight:800,color:C.text,fontSize:14}}>Fälliger Gesamtbetrag</span>
              <span style={{fontWeight:800,color:C.green,fontSize:14,whiteSpace:"nowrap"}}>{tot.toLocaleString("de-DE",{minimumFractionDigits:2})} €</span>
            </div>
          </div>
          <Btn onClick={()=>setScreen({...doc,_preview:true})} full>👁 Vorschau &amp; Drucken</Btn>
          <Btn onClick={()=>{saveDocs(p=>p.filter(d=>d.id!==doc.id));closeDetail();}} variant="danger" full>Dokument löschen</Btn>
        </div>
      </Screen>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <Btn onClick={()=>setScreen("new")} full>+ Neues Dokument</Btn>
        <Btn onClick={()=>setScreen("settings")} variant="ghost" full>⚙ Firmendaten</Btn>
      </div>
      {docs.length===0&&(
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:32,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:8}}>📄</div>
          <div style={{color:C.textSub,fontSize:14}}>Noch keine Dokumente.</div>
          <div style={{color:C.muted,fontSize:12,marginTop:4}}>Zuerst Firmendaten unter ⚙ einrichten.</div>
        </div>
      )}
      {docs.map(d=>{
        const tot=d.positionen.reduce((s,p)=>s+parseFloat(p.betrag||0),0);
        return(
          <div key={d.id} onClick={()=>setScreen(d)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:700,fontSize:15,color:C.text}}>{DOC_TYPES[d.type]||d.type}{d.nr?` · ${d.nr}`:""}</div>
              <div style={{fontSize:13,color:C.textSub,marginTop:2}}>{d.contact} · {d.datum}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:800,color:C.green,fontSize:15}}>{tot.toLocaleString("de-DE",{minimumFractionDigits:2})} €</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>{d.positionen.length} Pos.</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}


// ── App ───────────────────────────────────────────────────────────────────────
const NAV=[
  {id:"dashboard",label:"Home",icon:"⬛"},
  {id:"contacts",label:"Kontakte",icon:"👤"},
  {id:"tasks",label:"Aufgaben",icon:"✅"},
  {id:"docs",label:"Dokumente",icon:"📄"},
  {id:"ai",label:"KI",icon:"✦"},
];
const VIEWS={dashboard:"Dashboard",contacts:"Kontakte",tasks:"Aufgaben",activity:"Aktivitäten",ai:"KI-Assistent",docs:"Dokumente"};

function App(){
  const [view,setView]=useState("dashboard");
  const [contacts,setContactsRaw]=useState(()=>lsGet("crm:contacts",DEF_CONTACTS));
  const [tasks,setTasksRaw]=useState(()=>lsGet("crm:tasks",DEF_TASKS));
  const [activities,setActivitiesRaw]=useState(()=>lsGet("crm:activities",DEF_ACT));

  const setContacts=val=>{const n=typeof val==="function"?val(contacts):val;setContactsRaw(n);lsSet("crm:contacts",n);};
  const setTasks=val=>{const n=typeof val==="function"?val(tasks):val;setTasksRaw(n);lsSet("crm:tasks",n);};
  const setActivities=val=>{const n=typeof val==="function"?val(activities):val;setActivitiesRaw(n);lsSet("crm:activities",n);};

  const NAV_H = 56;
  const HEADER_H = 60;

  return(
    <div style={{position:"fixed",inset:0,background:C.bg,display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto"}}>
      {/* Header */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,paddingTop:"max(10px, env(safe-area-inset-top))"}}>
        <div>
          <div style={{fontWeight:900,fontSize:18,color:C.text,letterSpacing:-.5}}><span style={{color:C.accent}}>▸</span> ClientOS</div>
          <div style={{fontSize:11,color:C.muted}}>{VIEWS[view]}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"7px 12px"}}>
          <span style={{fontSize:10,color:C.green}}>●</span>
          <span style={{fontSize:12,color:C.textSub,fontWeight:600}}>Gespeichert</span>
        </div>
      </div>

      {/* Scrollable content — fixed height, isolated scroll */}
      <div style={{flex:1,overflowY:"scroll",WebkitOverflowScrolling:"touch",padding:"16px 16px 16px"}}>
        {view==="dashboard"&&<Dashboard contacts={contacts} tasks={tasks} activities={activities}/>}
        {view==="contacts"&&<Contacts contacts={contacts} setContacts={setContacts} setActivities={setActivities}/>}
        {view==="tasks"&&<Tasks tasks={tasks} setTasks={setTasks} contacts={contacts} setActivities={setActivities}/>}
        {view==="activity"&&<Activity activities={activities} setActivities={setActivities}/>}
        {view==="docs"&&<Docs contacts={contacts}/>}
        {view==="ai"&&<AI contacts={contacts} tasks={tasks}/>}
      </div>

      {/* Bottom Nav */}
      <div style={{background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setView(n.id)} style={{flex:1,background:"transparent",border:"none",padding:"12px 4px 10px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",borderTop:view===n.id?`2px solid ${C.accent}`:"2px solid transparent"}}>
            <span style={{fontSize:20}}>{n.icon}</span>
            <span style={{fontSize:10,color:view===n.id?C.accent:C.muted,fontWeight:view===n.id?700:400,fontFamily:"inherit"}}>{n.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
